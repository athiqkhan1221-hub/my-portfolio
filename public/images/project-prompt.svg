<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="480" fill="#111311"/>
  <rect x="24" y="24" width="752" height="432" rx="12" fill="#1B1E1B" stroke="#303530" stroke-width="1.5"/>
  <!-- Top Bar -->
  <rect x="24" y="24" width="752" height="44" rx="12" fill="#202420"/>
  <circle cx="56" cy="46" r="6" fill="#3A403A"/>
  <circle cx="76" cy="46" r="6" fill="#3A403A"/>
  <circle cx="96" cy="46" r="6" fill="#3A403A"/>
  <text x="128" y="50" fill="#A5ACA5" font-family="'JetBrains Mono', monospace" font-size="12">prompt_lab // evaluation_matrix.py</text>
  <rect x="650" y="38" width="100" height="18" rx="9" fill="#111311" stroke="#303530"/>
  <text x="664" y="51" fill="#9E70F9" font-family="'JetBrains Mono', monospace" font-size="10">EXPERIMENT</text>

  <!-- Side-by-Side Prompt Comparison -->
  <g transform="translate(56, 88)">
    <!-- Column 1: Zero-Shot (Naive) -->
    <rect x="0" y="0" width="330" height="336" rx="8" fill="#111311" stroke="#303530"/>
    <rect x="0" y="0" width="330" height="36" rx="8" fill="#202420"/>
    <text x="16" y="24" fill="#F9709E" font-family="'JetBrains Mono', monospace" font-size="11">METHOD A: ZERO-SHOT</text>
    
    <text x="16" y="60" fill="#A5ACA5" font-family="'JetBrains Mono', monospace" font-size="10">USER PROMPT:</text>
    <rect x="16" y="70" width="298" height="60" rx="4" fill="#1B1E1B"/>
    <text x="26" y="92" fill="#F4F3ED" font-family="'Inter', sans-serif" font-size="11">"Summarize this code file and tell me if</text>
    <text x="26" y="112" fill="#F4F3ED" font-family="'Inter', sans-serif" font-size="11">there are any bugs in it."</text>

    <text x="16" y="156" fill="#A5ACA5" font-family="'JetBrains Mono', monospace" font-size="10">MODEL OUTPUT VARIANCE:</text>
    <rect x="16" y="166" width="298" height="110" rx="4" fill="#1B1E1B"/>
    <text x="26" y="188" fill="#A5ACA5" font-family="'Inter', sans-serif" font-size="11">• Inconsistent format across runs</text>
    <text x="26" y="210" fill="#A5ACA5" font-family="'Inter', sans-serif" font-size="11">• Speculative bug claims (hallucination)</text>
    <text x="26" y="232" fill="#A5ACA5" font-family="'Inter', sans-serif" font-size="11">• Lacks actionable line references</text>
    <text x="26" y="254" fill="#F9709E" font-family="'JetBrains Mono', monospace" font-size="10">Adherence Score: 52%</text>

    <!-- Column 2: Structured Persona + Delimiters -->
    <rect x="358" y="0" width="330" height="336" rx="8" fill="#111311" stroke="#C2F970" stroke-width="1.2"/>
    <rect x="358" y="0" width="330" height="36" rx="8" fill="#202420"/>
    <text x="374" y="24" fill="#C2F970" font-family="'JetBrains Mono', monospace" font-size="11">METHOD B: DELIMITED FEW-SHOT</text>

    <text x="374" y="60" fill="#A5ACA5" font-family="'JetBrains Mono', monospace" font-size="10">SYSTEM + DELIMITER SPEC:</text>
    <rect x="374" y="70" width="298" height="60" rx="4" fill="#1B1E1B"/>
    <text x="384" y="90" fill="#C2F970" font-family="'JetBrains Mono', monospace" font-size="10">&lt;role&gt;Senior Code Auditor&lt;/role&gt;</text>
    <text x="384" y="106" fill="#A5ACA5" font-family="'JetBrains Mono', monospace" font-size="10">&lt;rules&gt;Only report syntax errors with line #&lt;/rules&gt;</text>
    <text x="384" y="122" fill="#A5ACA5" font-family="'JetBrains Mono', monospace" font-size="10">&lt;output_format&gt;Strict JSON schema&lt;/output_format&gt;</text>

    <text x="374" y="156" fill="#A5ACA5" font-family="'JetBrains Mono', monospace" font-size="10">DETERMINISTIC EVALUATION:</text>
    <rect x="374" y="166" width="298" height="110" rx="4" fill="#1B1E1B"/>
    <text x="384" y="188" fill="#F4F3ED" font-family="'Inter', sans-serif" font-size="11">✓ Zero markdown leakage outside JSON</text>
    <text x="384" y="210" fill="#F4F3ED" font-family="'Inter', sans-serif" font-size="11">✓ 100% reproducible field schema</text>
    <text x="384" y="232" fill="#F4F3ED" font-family="'Inter', sans-serif" font-size="11">✓ Direct line-item verification</text>
    <text x="384" y="254" fill="#C2F970" font-family="'JetBrains Mono', monospace" font-size="10">Adherence Score: 98% ★</text>
  </g>
</svg>
